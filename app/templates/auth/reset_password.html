<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – JobTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-card { width: 100%; max-width: 420px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg); }
  </style>
</head>
<body>
  <div class="auth-card animate-in">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:52px;height:52px;background:var(--accent-dim);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px;">🔐</div>
      <h1 style="font-size:22px;font-weight:800;margin-bottom:6px;">Reset Password</h1>
      <p style="color:var(--text-secondary);font-size:14px;">Enter your email, OTP, and a new password below.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=True) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-bottom:16px;border-radius:8px;">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label required" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@college.edu" value="{{ email }}" required />
      </div>
      <div class="form-group">
        <label class="form-label required" for="otp">6-digit OTP</label>
        <input type="text" id="otp" name="otp" class="form-control" placeholder="Enter OTP" maxlength="6" required />
      </div>
      </div>
      <div class="form-group">
        <label class="form-label required" for="password">New Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="New password" required />
      </div>
      <div class="form-group">
        <label class="form-label required" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm new password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">Reset Password</button>
    </form>
    <form method="POST" action="{{ url_for('auth.resend_otp') }}" style="display:flex;justify-content:flex-end;margin-top:16px;">
      <input type="hidden" name="email" value="{{ email }}" />
      <button type="submit" class="btn btn-secondary" style="padding:10px 16px;">Resend OTP</button>
    </form>
    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-secondary);">
      <a href="{{ url_for('auth.login') }}" style="color:var(--accent);">← Back to Login</a>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
